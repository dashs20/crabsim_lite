# body inertia
body_length_mm: 120
body_width_mm: 25
body_height_mm: 35
body_mass_g: 400

# actuator data
motor_lookup: 'motor_lookup.csv'
motor_time_constant_ms: 200 # time it takes for motor to reach ~2/3 its command RPM
servo_time_constant_ms: 50 # time it takes for servo to reach ~2/3 its command angle

# rotor inertia
rotor_length_mm: 127
rotor_width_mm: 10
rotor_thickness_mm: 1
rotor_mass_g: 2.2

# vehicle geometry
r_cg2px_mm: [100, 0, -50]
r_cg2nx_mm: [-100, 0, -50]

# Q and R (abstracted to Bryson's rule)
Q_max_acceptable_error_degps: [200,200,1000] # wx wy wz
Servo_max_angles_deg: 60 # phi

# matrix pickle
pickle_path: 'bicopter_sdre_matrices.pkl'